[project]
name = "faceswap-iroop"
version = "0.1.0"
description = "Face swap application with real-time processing and GPU acceleration"
requires-python = ">=3.9,<3.12"
dependencies = [
    "numpy==1.24.3",
    "opencv-python==4.8.1.78",
    "cv2-enumerate-cameras==1.1.15",
    "pillow==9.5.0",
    "tqdm==4.66.4",
    "torch==2.0.1",
    "torchvision==0.15.2",
    "onnx==1.16.0",
    "onnxruntime-gpu==1.18.0",
    "insightface==0.7.3",
    "gfpgan==1.3.8",
    "basicsr==1.4.2",
    "facexlib==0.3.0",
    "tk==0.1.0",
    "customtkinter==5.2.2",
    "psutil==5.9.8",
    "protobuf==4.23.2",
    "sympy==1.14.0",
]

# Note: TensorFlow and typing-extensions must be installed separately via pip
# due to version conflicts that uv cannot resolve:
#   uv pip install tensorflow==2.12.1
#   uv pip install typing-extensions==4.15.0

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }
